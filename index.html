<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>选区生图</title>
  <style>
    :root { }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1f2124;
      color: #d8dade;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    #topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 6px 8px;
      background: #26292d;
      border-bottom: 1px solid #33373d;
    }
    #appTitle { font-weight: 600; flex: 0 0 auto; margin-right: 8px; }
    #apiState {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      color: #767c85;
    }
    #apiState.ok { color: #79c48a; }
    #btnOpenSettings { flex: 0 0 auto; padding: 3px 10px; margin-left: 6px; }
    /* 设置视图：用「两块内容互斥显示」代替绝对定位浮层。
       Photoshop 的面板引擎对绝对定位的层叠处理不可靠，浮层会被主界面盖住，
       出现文字叠文字、输入框叠输入框。 */
    #settingsPanel {
      display: none;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      background: #1f2124;
    }
    #settingsPanel.open { display: flex; }
    #topbar.hidden, #body.hidden { display: none; }
    #settingsHead {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 6px 8px;
      background: #26292d;
      border-bottom: 1px solid #33373d;
    }
    #settingsTitle { flex: 1 1 auto; font-weight: 600; }
    #btnCloseSettings { flex: 0 0 auto; margin-left: 6px; }
    #settingsBody { flex: 1 1 auto; overflow-y: auto; padding: 8px; }
    #body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px;
    }
    .section {
      background: #2a2d31;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #8f959d;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    /* 参数行：Photoshop 面板（UXP）会给原生输入控件一个偏大的布局盒子，
       光靠 margin 收不紧，这里把行高和控件高度都钉死。 */
    .row {
      display: flex;
      align-items: center;
      height: 26px;
      min-height: 26px;
      max-height: 26px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .row:last-child { margin-bottom: 0; }
    .label { width: 62px; flex: 0 0 62px; color: #9aa0a8; line-height: 26px; }
    .grow { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select {
      width: 100%;
      background: #1a1c1f;
      color: #e3e5e8;
      border: 1px solid #3a3e44;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: inherit;
    }
    /* 单行输入框与下拉框统一钉到 24px，避免宿主把它们撑成一大块。 */
    input[type="text"], input[type="password"], input[type="number"], select {
      height: 24px;
      min-height: 24px;
      max-height: 24px;
      min-width: 0;
      padding: 0 6px;
    }
    textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
    button {
      background: #3a3e44;
      color: #e3e5e8;
      border: none;
      border-radius: 4px;
      height: 26px;
      padding: 0 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    button.primary { background: #3d6ff5; }
    button.danger { background: #a3382f; }
    button:disabled { opacity: 0.45; }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    .btn-row button { flex: 1 1 0; }
    /* 档位切换：不用原生下拉框——Windows 的原生弹出列表不归我们管，
       字体和配色都会跟面板对不上。 */
    .seg { display: flex; height: 24px; }
    .seg button {
      flex: 1 1 0;
      height: 24px;
      min-width: 0;
      padding: 0 4px;
      border-radius: 0;
      border: 1px solid #3a3e44;
      border-right: none;
      background: #33373d;
      color: #b9bfc7;
      overflow: hidden;
    }
    .seg button:first-child { border-radius: 4px 0 0 4px; }
    .seg button:last-child { border-radius: 0 4px 4px 0; border-right: 1px solid #3a3e44; }
    .seg button.active { background: #3d6ff5; color: #fff; border-color: #3d6ff5; }
    .sub-label { color: #9aa0a8; margin: 8px 0 4px; }
    .model-list {
      max-height: 150px;
      overflow-y: auto;
      background: #1a1c1f;
      border: 1px solid #3a3e44;
      border-radius: 4px;
      padding: 2px;
    }
    .model-item {
      padding: 3px 6px;
      border-radius: 3px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-item.empty { color: #767c85; cursor: default; }
    .model-item.active { background: #3d6ff5; color: #fff; }
    .model-sep { color: #767c85; font-size: 11px; padding: 4px 6px 2px; }
    .hint { color: #767c85; font-size: 11px; margin-top: 4px; line-height: 1.5; }
    /* 设置页单独放宽：这一页是配一次就不常来的，可以滚动，
       所以行距、控件高度都给足，别让人点不中输入框、看不清字。
       主界面的紧凑尺寸不受影响（那里要挤下任务队列和日志）。 */
    #settingsBody { padding: 10px; }
    #settingsBody .section { padding: 10px; margin-bottom: 10px; }
    #settingsBody .row {
      height: 34px;
      min-height: 34px;
      max-height: 34px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    #settingsBody .row:last-child { margin-bottom: 0; }
    #settingsBody .label { width: 66px; flex: 0 0 66px; line-height: 34px; font-size: 12px; }
    #settingsBody input[type="text"], #settingsBody input[type="password"] {
      height: 30px;
      min-height: 30px;
      max-height: 30px;
      padding: 0 8px;
      font-size: 13px;
    }
    #settingsBody .seg { height: 30px; }
    #settingsBody .seg button { height: 30px; font-size: 12px; padding: 0 6px; }
    #settingsBody .btn-row { gap: 8px; margin-top: 10px; }
    #settingsBody .btn-row button { height: 32px; font-size: 13px; }
    #settingsBody .hint { font-size: 12px; line-height: 1.7; margin-top: 8px; }
    #settingsBody .sub-label { font-size: 12px; margin: 14px 0 6px; }
    #settingsBody .model-list { max-height: 190px; padding: 4px; }
    #settingsBody .model-item { padding: 7px 8px; font-size: 13px; margin-bottom: 2px; }
    #settingsBody .model-item:last-child { margin-bottom: 0; }
    #settingsBody .model-sep { font-size: 12px; padding: 8px 8px 3px; }
    #log {
      font-family: Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
      max-height: 160px;
      overflow-y: auto;
      background: #17191b;
      border-radius: 4px;
      padding: 6px;
    }
    .lg-info { color: #9db2cc; }
    .lg-ok { color: #79c48a; }
    .lg-warn { color: #d8b46a; }
    .lg-err { color: #e0857c; }
    #taskList { }
    .task {
      display: flex;
      align-items: center;
      background: #1f2225;
      border-radius: 4px;
      padding: 4px 6px;
      margin-bottom: 4px;
    }
    .task .tname { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task .tstate { flex: 0 0 auto; margin-left: 6px; color: #9aa0a8; }
    .task .tkill { flex: 0 0 auto; margin-left: 6px; height: 20px; padding: 0 6px; font-size: 11px; }
    #preview {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    #preview img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #3a3e44;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <span id="appTitle">选区生图</span>
      <span id="apiState">未配置 API</span>
      <button id="btnOpenSettings">设置</button>
    </div>
    <div id="body">

      <div class="section">
        <div class="section-title"><span>① 提示词</span></div>
        <textarea id="prompt" placeholder="每行一条提示词。单行=生成一张；多行=按行批量生成。"></textarea>
        <div class="row" style="margin-top:6px;">
          <div class="label">尺寸档</div>
          <div class="grow">
            <div class="seg" id="sizeTierSeg">
              <button type="button" data-v="1024">1K</button>
              <button type="button" data-v="2048" class="active">2K</button>
              <button type="button" data-v="4096">4K</button>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="label">并发数</div>
          <div class="grow"><input type="number" id="concurrency" min="1" max="8" step="1" value="2" /></div>
        </div>
        <div class="row">
          <div class="label">超时(秒)</div>
          <div class="grow"><input type="number" id="timeout" min="10" max="900" step="10" value="180" /></div>
        </div>
      </div>

      <div class="btn-row" style="margin-bottom:8px;">
        <button class="primary" id="btnGenerate">从选区生成</button>
        <button class="danger" id="btnStopAll">全部中断</button>
      </div>

      <div class="section">
        <div class="section-title"><span>② 任务队列</span><span id="queueStat">空闲</span></div>
        <div id="taskList"></div>
        <div id="preview"></div>
      </div>

      <div class="section">
        <div class="section-title"><span>③ 运行日志</span></div>
        <div id="log"></div>
      </div>

    </div>

    <div id="settingsPanel">
      <div id="settingsHead">
        <span id="settingsTitle">设置</span>
        <button id="btnCloseSettings">返回</button>
      </div>
      <div id="settingsBody">

        <div class="section">
          <div class="section-title"><span>API 配置</span></div>
          <div class="row">
            <div class="label">接口地址</div>
            <div class="grow"><input type="text" id="baseUrl" placeholder="https://api.example.com" /></div>
          </div>
          <div class="row">
            <div class="label">API Key</div>
            <div class="grow"><input type="password" id="apiKey" placeholder="sk-..." /></div>
          </div>
          <div class="row">
            <div class="label">协议</div>
            <div class="grow">
              <div class="seg" id="protocolSeg">
                <button type="button" data-v="openai" class="active">OpenAI</button>
                <button type="button" data-v="gemini">Gemini</button>
                <button type="button" data-v="chat">对话式</button>
              </div>
            </div>
          </div>
          <div class="hint" id="protocolHint"></div>
          <div class="row">
            <div class="label">模型</div>
            <div class="grow"><input type="text" id="model" placeholder="点下方按钮拉取，或手动填写" /></div>
          </div>
          <div class="btn-row">
            <button id="btnPullModels">拉取模型列表</button>
            <button id="btnSaveCfg">保存配置</button>
          </div>
          <div class="sub-label">可选模型</div>
          <div id="modelList" class="model-list">
            <div class="model-item empty">（未拉取，先填地址再点「拉取模型列表」）</div>
          </div>
          <div class="hint">只填 base url，不要带 /v1。Key 只存在本机，不会上传。</div>
        </div>

        <div class="section">
          <div class="section-title"><span>当前状态</span></div>
          <div class="hint" id="settingsState">未配置 API</div>
          <div class="hint">用法：在这里配好接口 → 拉取模型 → 选模型 → 回到主界面，在 PS 里框选 → 写提示词 → 点「从选区生成」。</div>
        </div>

      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
