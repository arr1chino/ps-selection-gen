<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>选区生图</title>
  <style>
    :root { }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1f2124;
      color: #d8dade;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    #topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 6px 8px;
      background: #26292d;
      border-bottom: 1px solid #33373d;
    }
    #appTitle { font-weight: 600; flex: 0 0 auto; margin-right: 8px; }
    #apiState {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      color: #767c85;
    }
    #apiState.ok { color: #79c48a; }
    #btnOpenSettings { flex: 0 0 auto; padding: 3px 10px; margin-left: 6px; }
    #settingsPanel {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
      flex-direction: column;
      background: #1f2124;
    }
    #settingsPanel.open { display: flex; }
    #settingsHead {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 6px 8px;
      background: #26292d;
      border-bottom: 1px solid #33373d;
    }
    #settingsTitle { flex: 1 1 auto; font-weight: 600; }
    #btnCloseSettings { flex: 0 0 auto; margin-left: 6px; }
    #settingsBody { flex: 1 1 auto; overflow-y: auto; padding: 8px; }
    #body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px;
    }
    .section {
      background: #2a2d31;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #8f959d;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .row { display: flex; align-items: center; margin-bottom: 6px; }
    .row:last-child { margin-bottom: 0; }
    .label { width: 62px; flex: 0 0 62px; color: #9aa0a8; }
    .grow { flex: 1 1 auto; min-width: 0; }
    input[type="text"], input[type="password"], input[type="number"], textarea, select {
      width: 100%;
      background: #1a1c1f;
      color: #e3e5e8;
      border: 1px solid #3a3e44;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
    select { padding: 4px; }
    button {
      background: #3a3e44;
      color: #e3e5e8;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    button.primary { background: #3d6ff5; }
    button.danger { background: #a3382f; }
    button:disabled { opacity: 0.45; }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    .btn-row button { flex: 1 1 0; }
    .hint { color: #767c85; font-size: 11px; margin-top: 4px; line-height: 1.5; }
    #log {
      font-family: Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
      max-height: 160px;
      overflow-y: auto;
      background: #17191b;
      border-radius: 4px;
      padding: 6px;
    }
    .lg-info { color: #9db2cc; }
    .lg-ok { color: #79c48a; }
    .lg-warn { color: #d8b46a; }
    .lg-err { color: #e0857c; }
    #taskList { }
    .task {
      display: flex;
      align-items: center;
      background: #1f2225;
      border-radius: 4px;
      padding: 4px 6px;
      margin-bottom: 4px;
    }
    .task .tname { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task .tstate { flex: 0 0 auto; margin-left: 6px; color: #9aa0a8; }
    .task .tkill { flex: 0 0 auto; margin-left: 6px; padding: 2px 6px; font-size: 11px; }
    #preview {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    #preview img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #3a3e44;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <span id="appTitle">选区生图</span>
      <span id="apiState">未配置 API</span>
      <button id="btnOpenSettings">设置</button>
    </div>
    <div id="body">

      <div class="section">
        <div class="section-title"><span>① 提示词</span></div>
        <textarea id="prompt" placeholder="每行一条提示词。单行=生成一张；多行=按行批量生成。"></textarea>
        <div class="row" style="margin-top:6px;">
          <div class="label">尺寸档</div>
          <div class="grow">
            <select id="sizeTier">
              <option value="1024">1K（1024 短边）</option>
              <option value="2048" selected>2K（2048 短边）</option>
              <option value="4096">4K（4096 短边）</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="label">并发数</div>
          <div class="grow"><input type="number" id="concurrency" min="1" max="8" step="1" value="2" /></div>
        </div>
        <div class="row">
          <div class="label">超时(秒)</div>
          <div class="grow"><input type="number" id="timeout" min="10" max="900" step="10" value="180" /></div>
        </div>
      </div>

      <div class="btn-row" style="margin-bottom:8px;">
        <button class="primary" id="btnGenerate">从选区生成</button>
        <button class="danger" id="btnStopAll">全部中断</button>
      </div>

      <div class="section">
        <div class="section-title"><span>② 任务队列</span><span id="queueStat">空闲</span></div>
        <div id="taskList"></div>
        <div id="preview"></div>
      </div>

      <div class="section">
        <div class="section-title"><span>③ 运行日志</span></div>
        <div id="log"></div>
      </div>

    </div>

    <div id="settingsPanel">
      <div id="settingsHead">
        <span id="settingsTitle">设置</span>
        <button id="btnCloseSettings">返回</button>
      </div>
      <div id="settingsBody">

        <div class="section">
          <div class="section-title"><span>API 配置</span></div>
          <div class="row">
            <div class="label">接口地址</div>
            <div class="grow"><input type="text" id="baseUrl" placeholder="https://api.example.com" /></div>
          </div>
          <div class="row">
            <div class="label">API Key</div>
            <div class="grow"><input type="password" id="apiKey" placeholder="sk-..." /></div>
          </div>
          <div class="row">
            <div class="label">协议</div>
            <div class="grow">
              <select id="protocol">
                <option value="openai">OpenAI 风格 (/v1/images/edits)</option>
                <option value="gemini">Gemini 风格 (:generateContent)</option>
                <option value="chat">对话式 (/v1/chat/completions)</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="label">模型</div>
            <div class="grow"><input type="text" id="model" placeholder="点下方按钮拉取，或手动填写" /></div>
          </div>
          <div class="btn-row">
            <button id="btnPullModels">拉取模型列表</button>
            <button id="btnSaveCfg">保存配置</button>
          </div>
          <div class="row" style="margin-top:6px;">
            <div class="label">可选模型</div>
            <div class="grow"><select id="modelPicker"><option value="">（未拉取）</option></select></div>
          </div>
          <div class="hint">只填 base url，不要带 /v1。Key 只存在本机，不会上传。</div>
          <div class="hint">nano banana：直连 Gemini 选「Gemini 风格」；只有对话接口的中转站选「对话式」。</div>
        </div>

        <div class="section">
          <div class="section-title"><span>当前状态</span></div>
          <div class="hint" id="settingsState">未配置 API</div>
          <div class="hint">用法：在这里配好接口 → 拉取模型 → 选模型 → 回到主界面，在 PS 里框选 → 写提示词 → 点「从选区生成」。</div>
        </div>

      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
